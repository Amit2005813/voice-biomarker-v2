apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-biomarker-frontend
  namespace: voice-biomarker
  labels:
    app: voice-biomarker
    component: frontend
    version: v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voice-biomarker
      component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: voice-biomarker
        component: frontend
        version: v2
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: frontend
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          env:
            - name: API_URL
              value: "http://api-service:8000"
            - name: STREAMLIT_SERVER_PORT
              value: "8501"
            - name: STREAMLIT_SERVER_ADDRESS
              value: "0.0.0.0"
            - name: STREAMLIT_SERVER_HEADLESS
              value: "true"
            - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
              value: "false"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: upload-volume
              mountPath: /app/uploads
              readOnly: true
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: upload-volume
          persistentVolumeClaim:
            claimName: voice-biomarker-uploads-pvc
        - name: tmp-volume
          emptyDir:
            sizeLimit: 200Mi
      terminationGracePeriodSeconds: 30
