apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: voice-biomarker
  labels:
    app: voice-biomarker
    component: api
spec:
  type: ClusterIP
  selector:
    app: voice-biomarker
    component: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: api-service-external
  namespace: voice-biomarker
  labels:
    app: voice-biomarker
    component: api
spec:
  type: LoadBalancer
  selector:
    app: voice-biomarker
    component: api
  ports:
    - name: https
      port: 443
      targetPort: 8000
      protocol: TCP
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  externalTrafficPolicy: Local
  sessionAffinity: None
