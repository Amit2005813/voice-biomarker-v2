apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: voice-biomarker
  labels:
    app: voice-biomarker
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: voice-biomarker
    component: frontend
  ports:
    - name: http
      port: 8501
      targetPort: 8501
      protocol: TCP
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service-external
  namespace: voice-biomarker
  labels:
    app: voice-biomarker
    component: frontend
spec:
  type: LoadBalancer
  selector:
    app: voice-biomarker
    component: frontend
  ports:
    - name: https
      port: 443
      targetPort: 8501
      protocol: TCP
    - name: http
      port: 80
      targetPort: 8501
      protocol: TCP
  externalTrafficPolicy: Local
  sessionAffinity: None
