apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-biomarker-redis
  namespace: voice-biomarker
  labels:
    app: voice-biomarker
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voice-biomarker
      component: redis
  template:
    metadata:
      labels:
        app: voice-biomarker
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          command:
            - redis-server
            - --maxmemory
            - "256mb"
            - --maxmemory-policy
            - allkeys-lru
            - --appendonly
            - "yes"
            - --save
            - "60"
            - "1000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: voice-biomarker-redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: voice-biomarker
  labels:
    app: voice-biomarker
    component: redis
spec:
  type: ClusterIP
  selector:
    app: voice-biomarker
    component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
