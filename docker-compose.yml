# ============================================================================
# Voice Biomarker Platform v2 - Docker Compose Configuration
# Production-ready multi-service deployment
# ============================================================================

version: "3.9"

services:
  # ---------------------- API Service (FastAPI) ------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: voice-biomarker-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - APP_WORKERS=${APP_WORKERS:-4}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MODEL_PATH=/app/models
      - DATA_PATH=/app/data
      - UPLOAD_PATH=/app/uploads
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-52428800}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/voice_biomarker.db}
    volumes:
      - model-data:/app/models
      - app-data:/app/data
      - upload-data:/app/uploads
      - app-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------- Frontend Service (Streamlit) ----------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: voice-biomarker-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    environment:
      - API_URL=http://api:8000
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - STREAMLIT_THEME_PRIMARY=${STREAMLIT_THEME_PRIMARY:-#FF6B6B}
    volumes:
      - upload-data:/app/uploads:ro
      - app-logs:/app/logs
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------- Redis (Caching) -----------------------------------
  redis:
    image: redis:7-alpine
    container_name: voice-biomarker-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --save 60 1000
    volumes:
      - redis-data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------- Nginx (Reverse Proxy) -----------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: voice-biomarker-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - api
      - frontend
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ---------------------- Volumes ----------------------------------------------
volumes:
  model-data:
    driver: local
    name: voice-biomarker-models
  app-data:
    driver: local
    name: voice-biomarker-data
  upload-data:
    driver: local
    name: voice-biomarker-uploads
  app-logs:
    driver: local
    name: voice-biomarker-logs
  redis-data:
    driver: local
    name: voice-biomarker-redis
  nginx-logs:
    driver: local
    name: voice-biomarker-nginx

# ---------------------- Networks ---------------------------------------------
networks:
  frontend-net:
    driver: bridge
    name: voice-biomarker-frontend
  backend-net:
    driver: bridge
    name: voice-biomarker-backend
